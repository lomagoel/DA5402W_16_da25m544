#name of pipeline
name: deploy ML training

on:
  push:
    branches:
      - main

        
env:
  SA_KEY: ${{secrets.SA_KEY}}
  ARTIFACT_REPO_REGION: ${{vars.ARTIFACT_REPO_REGION}}
  PROJECT_ID: ${{secrets.PROJECT_ID}}
  ARTIFACT_REGISTRY_REPO_NAME: ${{vars.ARTIFACT_REGISTRY_REPO_NAME}}
  IMAGE_NAME: caltech-mobilenetv2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_URI: "${{vars.ARTIFACT_REPO_REGION}}-docker-pkg-dev/${{secrets.PROJECT_ID}}/${{vars.ARTIFACT_REGISTRY_REPO_NAME}}/caltech-mobilenetv2:{{github.sha}}"


jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: download code
        uses: actions/checkout@v4

      - name: install docker
        run: apt-get install docker
      
      - name: gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: build
        run:  docker build -t ${{env.IMAGE_URI}} 

      - name: authenticate using SA
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SA_KEY }}
      - name: configure docker auth mechanism
        run: gcloud auth configure-docker "${{env.ARTIFACT_REPO_REGION}}-docker-pkg-dev"

      - name: push to artifact registry
        run:  docker push -t $IMAGE_URI