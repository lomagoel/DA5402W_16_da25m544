
data_dir: "/gcs/caltech_1000/"  # dataset root directory
experiment_name: "caltech101-mobilenetv2"
tracking_uri: null  # optional MLflow tracking URI

# create config
epochs: 10
batch_size: 32
learning_rate: 0.001
weight_decay: 0.0001
image_size: 224
num_workers: 2
seed: 42

# In TrainConfig: pretrained defaults to True.
# Note: CLI flag --pretrained in train.py is inverted (store_true means "Do not load ImageNet weights.")
pretrained: true

# In TrainConfig: freeze_backbone defaults to True.
# YAML counterpart for CLI --unfreeze-backbone (inverse semantics).
freeze_backbone: true

device: "cuda"  # auto | cpu | cuda | mps